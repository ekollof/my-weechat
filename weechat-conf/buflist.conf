#
# weechat -- buflist.conf
#
# WARNING: It is NOT recommended to edit this file by hand,
# especially if WeeChat is running.
#
# Use commands like /set or /fset to change settings in WeeChat.
#
# For more info, see: https://weechat.org/doc/weechat/quickstart/
#

[look]
add_newline = on
auto_scroll = 50
display_conditions = "(${buffer.hidden} == || ${plugins.var.group_tools.buflist.feature.show_hidden_buffers.enabled} !=) && (${type} !~ ^(channel|feed|list|private)$ || ${type} =~ ^(channel|feed|list|private)$ && ${buffer[${info:search_server_buffer_ptr,${buffer}}].local_variables.buflist_fold}==)"
enabled = on
mouse_jump_visited_buffer = off
mouse_move_buffer = on
mouse_wheel = on
nick_prefix = off
nick_prefix_empty = on
signals_refresh = "irc_server_connected"
sort = "number"
use_items = 1

[format]
buffer = "${define:my_left_section_contents,${format_number}${eval:${plugins.var.group_tools.buflist.element.fold.format}}${if:${buffer.local_variables.type}!=server?${color:#6688cc}${if:${info:buflist_is_next_visible_buffer_part_of_same_server_as,${buffer.full_name}}?├─:╰─}${color:default}:}${format_nick_prefix}${if:${type}==server?${color:bold}${color:#6688cc}:${if:${type}==feed?${color:#6688cc}:${if:${type}==private?${color:#6688cc}:${color:default}}}}${format_name}${color:default}${format_lag}${eval:${plugins.var.group_tools.buflist.element.filter.format}}}${define:my_left_section_contents_length,${lengthscr:${my_left_section_contents}}}${define:my_right_section_contents,${format_hotlist}}${define:my_right_section_contents_length,${lengthscr:${my_right_section_contents}}}${if:${type}==server?${color:,215}:${color:default}}${if:${my_left_section_contents_length} > ${plugins.var.group_tools.buflist.section.left.size}?${cutscr:+${plugins.var.group_tools.buflist.section.left.size},${if:${type}==server?${color:white}:${color:${weechat.color.chat_prefix_more}}}${weechat.look.prefix_align_more},${my_left_section_contents}}:${my_left_section_contents}${repeat:${calc:${plugins.var.group_tools.buflist.section.left.size} - ${my_left_section_contents_length}}, }}${if:${my_right_section_contents_length} > ${plugins.var.group_tools.buflist.section.right.size}?${cutscr:+${plugins.var.group_tools.buflist.section.right.size},${if:${type}==server?${color:white}:${color:${weechat.color.chat_prefix_more}}}${weechat.look.prefix_align_more},${my_right_section_contents}}:${repeat:${calc:${plugins.var.group_tools.buflist.section.right.size} - ${my_right_section_contents_length}}, }${my_right_section_contents}}"
buffer_current = "${color:default,236}${format_buffer}${color:default}"
hotlist = "${if:${plugins.var.group_tools.buflist.element.hotlist.enabled}!=?${if:${plugins.var.group_tools.buflist.section.right.size}==1? :${hotlist}}}"
hotlist_highlight = "${color:*158}"
hotlist_low = "${color:242}"
hotlist_message = "${color:153}"
hotlist_none = "${color:default}"
hotlist_private = "${color:79}"
hotlist_separator = "${color:default},"
indent = "${if:${buffer.local_variables.type}!=server?${color:#6688cc}${if:${info:buflist_is_next_visible_buffer_part_of_same_server_as,${buffer.full_name}}?├─:╰─}${color:default}:}"
lag = "${if:${plugins.var.group_tools.buflist.element.lag.enabled}!=?${color:white} [${lag}]}"
name = "${if:${plugins.var.group_tools.buflist.element.name.enabled}!=?${define:my_name,${if:${type}==server?${if:${plugins.var.group_tools.buflist.feature.real_net_name.enabled}!=&&${info:irc_server_isupport_value,${name},NETWORK}!=?${info:irc_server_isupport_value,${name},NETWORK}:${name}}:${name}}}${define:my_name_length,${lengthscr:${my_name}}}${define:my_name,${if:${buffer.local_variables.buflist_start_at}!=?${revscr:${cutscr:+${calc:${my_name_length}-${buffer.local_variables.buflist_start_at}},…,${revscr:${my_name}}}}:${my_name}}}${if:${hotlist}!=?${eval:${color_hotlist}}:${if:${type}==server?${color:*153}:${if:${type}==feed?${color:23}:${if:${type}==private?${color:158}:${color:default}}}}}${my_name}}"
nick_prefix = "${if:${plugins.var.group_tools.buflist.element.nick_prefix.enabled}!=&&${buflist.look.nick_prefix}!=?${color:#6688cc}${nick_prefix}}"
number = "${if:${plugins.var.group_tools.buflist.element.number.enabled}!=?${if:${current_buffer}!=?${color:*white}${hide:>,${number}} :${if:${type}==server?${color:*white}}${number} }}"
tls_version = " ${color:default}(${if:${tls_version}==TLS1.3?${color:green}:${if:${tls_version}==TLS1.2?${color:yellow}:${color:red}}}${translate:${tls_version}}${color:default})"
