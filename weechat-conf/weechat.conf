status_modes = default
status_more = 223
status_mouse = 234
status_name = 234
status_name_insecure = 218
status_name_tls = 234
status_nicklist_count = 223
status_number = 223
status_time = 223

[completion]
base_word_until_cursor = on
case_sensitive = on
command_inline = on
cycle = on
default_template = "%(nicks)|%(irc_channels)|%(xmpp_account)"
nick_add_space = on
nick_case_sensitive = off
nick_completer = ": "
nick_first_only = off
nick_ignore_chars = "[]`_-^"
nick_ignore_words = ""
partial_completion_alert = on
partial_completion_auto_expand = on
partial_completion_command = off
partial_completion_command_arg = off
partial_completion_count = on
partial_completion_other = off
partial_completion_templates = "config_options"

[history]
display_default = 5
max_buffer_lines_minutes = 0
max_buffer_lines_number = 1024
max_commands = 100
max_visited_buffers = 50

[proxy]

[network]
connection_timeout = 60
gnutls_ca_system = on
gnutls_ca_user = ""
gnutls_handshake_timeout = 30
proxy_curl = ""

[plugin]
autoload = "*,!exec,!guile,!javascript,!lua,!ruby,!tcl,!xfer"
extension = ".so,.dll"
path = "${weechat_data_dir}/plugins"
save_config_on_unload = on

[signal]
sighup = "${if:${info:weechat_headless}?/reload:/quit -yes}"
sigquit = "/quit -yes"
sigterm = "/quit -yes"
sigusr1 = ""
sigusr2 = ""

